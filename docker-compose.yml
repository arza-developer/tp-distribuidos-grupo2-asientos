# [Decisión de Arquitectura]: Orquestación multicontenedor para Sistema Distribuido (Requisito 3.d)
# Topología: Microservicios desacoplados con bases de datos y runtimes independientes.

# [Requisito 3.e]: Configuración JWT compartida. Con HS256 TODOS los servicios necesitan la misma clave:
# el AuthServer la usa para FIRMAR y el resto para VERIFICAR.
# [Decisión]: Se define una sola vez (ancla "&jwt-env") y cada servicio la reutiliza con "<<: *jwt-env".
x-jwt-env: &jwt-env
  Jwt__Key: "SeatsReservation-Dev-Key-Change-Me-Min-32-Bytes!!"

services:

  # 1. Emulador local de colas Azure Storage Queues (LocalStack de Azure / Sin costo en nube)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: seats-azurite
    ports:
      - "10000:10000" # Blob Service
      - "10001:10001" # Queue Service (Broker asíncrono para Eventual Consistency)
      - "10002:10002" # Table Service
    cpus: 1.0
    mem_limit: 256m

  # 2. Servidor de Identidad OAuth2 / Tokens JWT (Requisito 3.e)
  auth-server:
    build:
      context: .
      args:
        SERVICE_NAME: AuthServer.Api
    container_name: seats-auth-server
    ports:
      - "5104:5104"
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "5104"
      # [3rd Party IdP]: adentro de Docker el proveedor se llama "external-idp", no localhost
      ExternalIdp__Authority: "http://external-idp:5105"
      # [3rd Party IdP - Google]: credenciales fuera del repo (GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET en un .env local).
      # Vacías => el login con Google queda apagado y se usa el proveedor simulado.
      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Authentication__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
    cpus: 1.0
    mem_limit: 256m

  # 3. Fachada Pública de Catálogo y Reservas (Clean Architecture - Requisito 3.a)
  availability:
    build:
      context: .
      args:
        SERVICE_NAME: Availability.Web
        # Estructura propia (Clean Architecture): ruta exacta al csproj de la capa Web
        SERVICE_PATH: src/Services/Availability/Availability/src/Availability.Web
    container_name: seats-availability
    ports:
      - "5101:5101"
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "5101"
      # [Req. 3.e]: token M2M para consultar a Booking (credenciales de desarrollo, igual que en el AuthServer)
      AuthServer__BaseUrl: "http://auth-server:5104"
      AuthServer__ClientSecret: "availability-secret-dev"
      Booking__BaseUrl: "http://booking-api:5102"
      # [Login federado, Authorization Code + PKCE]: el navegador va al Auth Server por su URL PÚBLICA (host), mientras que
      # el canje del código usa la interna (BaseUrl). La vuelta debe coincidir con las RedirectUris del cliente "frontend".
      AuthServer__PublicUrl: "http://localhost:5104"
      AuthServer__FrontendRedirectUri: "http://localhost:5101/Account/Callback"
      # [Broker]: Booking consume el topic de Azure Service Bus del docente. El secreto NO se versiona:
      # definir SERVICEBUS_CONNECTION_STRING en el entorno o en un .env local. Vacío => POST /api/reservations responde 503.
      ServiceBus__ConnectionString: "${SERVICEBUS_CONNECTION_STRING}"
      ConnectionStrings__Availability: "Data Source=/data/availability.db"
    volumes:
      - availability-data:/data
    depends_on:
      - auth-server
      - booking-api
      - external-idp # el Auth Server federa el login con el IdP externo (Fase 8)
    # [Decisión]: 2.0 CPUs para garantizar paralelismo real en el ThreadPool bajo concurrencia
    cpus: 2.0
    mem_limit: 512m

  # 4. Procesamiento Transaccional y Concurrencia de Asientos (N-Layer - Requisito 3.b y Paso 4)
  booking-api:
    build:
      context: .
      args:
        SERVICE_NAME: Booking.Api
    ports:
      - "5102:5102"
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "5102"
      ServiceBus__ConnectionString: "${SERVICEBUS_CONNECTION_STRING}"
      Services__PaymentGrpc: "http://seats-payment-grpc:5103"
      AuthServer__AuthenticationEndpoint: "http://auth-server:5104/connect/token"
    # [Decisión]: 2.0 CPUs para simular condiciones de carrera en acceso concurrente a asientos
    cpus: 2.0
    mem_limit: 512m

  # 5. Pasarela Financiera gRPC (Contrato estricto Protobuf sobre HTTP/2 - Requisito 3.c)
  payment-grpc:
    build:
      context: .
      args:
        SERVICE_NAME: Payment.Grpc
    container_name: seats-payment-grpc
    ports:
      - "5103:5103"
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "5103"
    cpus: 1.0
    mem_limit: 256m

  # 6. Consumidor de Notificaciones Asíncronas (Requisito 3.h)
  notifications-worker:
    build:
      context: .
      args:
        SERVICE_NAME: Notifications.Worker
    container_name: seats-notifications-worker
    environment:
      DOTNET_ENVIRONMENT: "Development"
    cpus: 1.0
    mem_limit: 256m

  # 7. Proveedor de identidad externo SIMULADO (3rd Party Identity Providers del diagrama)
  # [Decisión]: simulado, igual que Azurite simula el broker. Firma con RS256 y su propia llave privada.
  # NO recibe la clave Jwt__Key: es un tercero, no comparte secretos con nuestro sistema.
  external-idp:
    build:
      context: .
      args:
        SERVICE_NAME: ExternalIdentityProvider.Api
    container_name: seats-external-idp
    ports:
      - "5105:5105"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "5105"
    cpus: 0.5
    mem_limit: 256m

# Persistencia SQLite de Availability (sobrevive a recrear el contenedor)
volumes:
  availability-data: